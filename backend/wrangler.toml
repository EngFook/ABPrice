name = "tabletop-recap-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# claude-opus-5-5: best recaps, roughly US$0.30-0.50 per 4-hour session.
# claude-haiku-5-5: roughly US$0.01 per 4-hour session. Change here and redeploy.
CLAUDE_MODEL = "claude-opus-5-5"
DAILY_LIMIT_PER_DEVICE = "3"
# Caps the worst-case daily spend (about US$50 a day on Opus). Raise it as usage grows.
GLOBAL_DAILY_LIMIT = "100"

# Daily limits. Create it with: npx wrangler@4 kv namespace create RATE
# then paste the printed id here.
[[kv_namespaces]]
binding = "RATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file):
#   npx wrangler@4 secret put ANTHROPIC_API_KEY
#   npx wrangler@4 secret put APP_SHARED_KEY
